name: CI

# PR gates: nothing reaches main (and therefore Railway) unless everything here is green.
on:
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run check-content
      - run: npm run check
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build

  backend:
    name: Backend gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -e ".[dev]"
      - run: pytest
      - run: ruff check . && ruff format --check .

  docker:
    name: Docker builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t music-app-example-frontend:ci ./frontend
      - run: docker build -t music-app-example-backend:ci ./backend
